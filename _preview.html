<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>viewport preview</title>
<style>
  html, body { margin: 0; background: #16232f; }
  .stage { display: flex; gap: 16px; padding: 16px; }
  figure { margin: 0; }
  figcaption { padding: 6px 2px; color: #9fb4cc; font: 11px/1.4 ui-monospace, monospace; letter-spacing: .12em; }
  iframe { display: block; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="stage">
  <figure>
    <figcaption id="cap">IFRAME</figcaption>
    <iframe id="f" title="preview"></iframe>
  </figure>
</div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var theme = p.get('theme') === 'dark' ? 'dark' : 'light';
    var w = parseInt(p.get('w') || '390', 10);
    var h = parseInt(p.get('h') || '844', 10);
    var hash = p.get('hash') || '#/';
    var scroll = p.get('scroll') || '';
    try { localStorage.setItem('theme', theme); } catch (e) {}
    var f = document.getElementById('f');
    f.width = w;
    f.height = h;
    f.style.width = w + 'px';
    f.style.height = h + 'px';
    document.getElementById('cap').textContent = 'IFRAME ' + w + ' x ' + h + ' · ' + theme;
    f.addEventListener('load', function () {
      if (!scroll) return;
      var d = f.contentDocument;
      if (!d) return;
      setTimeout(function () {
        d.documentElement.style.scrollBehavior = 'auto';
        var el = d.querySelector(scroll);
        if (el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 64);
      }, 700);
    });
    f.src = './?v=20261118c&s=' + Date.now() + hash;
  })();
</script>
</body>
</html>
