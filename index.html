  html[data-theme="dark"] { background:#0B131F; }
  body { margin:0; background:#EDF5FC; color:#1C2A3B;

  html[data-theme="dark"] body { background:#0B131F; color:#EAF3FC; }

<script>
  // 첫 페인트 전에 테마를 정해 깜빡임을 없앤다.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved === 'dark' || saved === 'light' ? saved : (dark ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', theme === 'dark' ? '#0B131F' : '#EDF5FC');
  })();
</script>
