<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 페이지 · 전국</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --bg:#fbfaf7; --fg:#17181a; --muted:#6d727a; --accent:#b8461b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e0f11; --fg:#ecebe7; --muted:#9196a0; --accent:#f4794b; } }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--fg);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    text-align:center; padding:2rem;
  }
  .code { font-size:.75rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  h1 { font-size:clamp(1.6rem,5vw,2.3rem); letter-spacing:-.03em; margin:1rem 0 .8rem; }
  p { color:var(--muted); margin:0 0 2rem; line-height:1.8; }
  a { color:var(--accent); text-decoration:none; border-bottom:1px solid currentColor; padding-bottom:2px; }
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>여기에는 글이 없습니다</h1>
    <p>주소가 바뀌었거나, 오타일 수 있습니다.</p>
    <a id="home" href="/">첫 화면으로 돌아가기</a>
  </div>
  <script>
    // jeonsul.github.io 는 사용자 사이트라 첫 화면이 도메인 루트(/)에 있습니다.
    (function () {
      var home = location.pathname.indexOf('/Jeonsul.github.io') === 0 ? '/Jeonsul.github.io/' : '/';
      document.getElementById('home').setAttribute('href', home);
      setTimeout(function () { location.replace(home); }, 2200);
    })();
  </script>
</body>
</html>
