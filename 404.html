<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 페이지 · 전국</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg-1:#EDF5FC; --bg-2:#F5F9FE; --panel:#ffffff; --line:#CFE2F5;
    --fg:#1C2A3B; --text2:#5D7087; --blue:#128AFA; --cyan:#00AEEF; --pink:#FB7299;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1:#0B131F; --bg-2:#132033; --panel:#132033; --line:#213856;
      --fg:#EAF3FC; --text2:#9DB4CD; --blue:#38B6FF; --cyan:#6FD0FF; --pink:#FB7299;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
    color:var(--fg); text-align:center;
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background:
      radial-gradient(60rem 30rem at 80% -10%, rgba(0,174,239,.18), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  body::before {
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(90deg, rgba(18,138,250,.07) 1px, transparent 1px),
      linear-gradient(0deg, rgba(18,138,250,.07) 1px, transparent 1px);
    background-size:3rem 3rem;
    -webkit-mask-image:radial-gradient(70% 60% at 50% 40%, #000, transparent);
    mask-image:radial-gradient(70% 60% at 50% 40%, #000, transparent);
  }
  .card {
    position:relative; display:inline-block; max-width:26rem; padding:2.6rem 2.2rem 2.2rem;
    border-radius:18px; border:1px solid var(--line); background:var(--panel);
    box-shadow:0 18px 50px rgba(16,60,110,.14);
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%);
  }
  .card::before {
    content:""; position:absolute; inset:0 0 auto 0; height:4px; border-radius:18px 18px 0 0;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
  }
  .halo { display:block; width:3.2rem; height:3.2rem; margin:0 auto 1rem; color:var(--blue); }
  .badge {
    display:inline-block; padding:.22rem .85rem; transform:skewX(-12deg);
    border:1px solid rgba(18,138,250,.35); background:rgba(18,138,250,.08);
    color:var(--blue); font-size:.72rem; font-weight:800; letter-spacing:.16em;
  }
  .badge span { display:inline-block; transform:skewX(12deg); }
  h1 { font-size:clamp(1.45rem,5vw,1.9rem); letter-spacing:-.03em; margin:1.1rem 0 .7rem; }
  p { color:var(--text2); margin:0 0 1.8rem; line-height:1.8; font-size:.94rem; }
  a {
    display:inline-block; padding:.75rem 1.4rem; border-radius:4px; transform:skewX(-10deg);
    background:linear-gradient(135deg, var(--blue), #0E7BE0); color:#fff; text-decoration:none;
    font-size:.94rem; font-weight:800; letter-spacing:.02em;
    box-shadow:0 8px 20px rgba(18,138,250,.32);
  }
  a span { display:inline-block; transform:skewX(10deg); }
  .code { margin-top:1.3rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem;
    letter-spacing:.18em; color:var(--text2); opacity:.7; }
</style>
</head>
<body>
  <div class="card">
    <svg class="halo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <ellipse cx="16" cy="11" rx="11" ry="3.5" stroke="currentColor" stroke-width="1.4" opacity=".45"></ellipse>
      <ellipse cx="16" cy="8" rx="7.4" ry="2.4" stroke="currentColor" stroke-width="1.4"></ellipse>
      <path d="M10.4 17.6h11.2M16 17.6l-4.6 7.2M16 17.6l4.6 7.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <span class="badge"><span>NOT FOUND</span></span>
    <h1>여기에는 기록이 없습니다</h1>
    <p>주소가 바뀌었거나, 오타일 수 있습니다.</p>
    <a id="home" href="/"><span>첫 화면으로 돌아가기</span></a>
    <p class="code">ERROR 404 · SCHALE ARCHIVE</p>
  </div>
  <script>
    // jeonsul.github.io 는 사용자 사이트라 첫 화면이 도메인 루트(/)에 있습니다.
    (function () {
      var home = location.pathname.indexOf('/Jeonsul.github.io') === 0 ? '/Jeonsul.github.io/' : '/';
      document.getElementById('home').setAttribute('href', home);
      setTimeout(function () { location.replace(home); }, 2400);
    })();
  </script>
</body>
</html>
