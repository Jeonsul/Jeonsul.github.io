<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>없는 페이지 · 전국</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="전국 · 기록">
<link rel="icon" href="/assets/favicon.svg?v=20261119a" type="image/svg+xml">
<link rel="icon" href="/assets/icon-192.png?v=20261119a" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261119a">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png?v=20261119a">
<link rel="manifest" href="/manifest.webmanifest?v=20261119a">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg-1:#EDF5FC; --bg-2:#F5F9FE; --panel:#ffffff; --line:#CFE2F5;
    --fg:#1C2A3B; --text2:#5D7087; --blue:#128AFA; --cyan:#00AEEF; --pink:#FB7299;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1:#0B131F; --bg-2:#132033; --panel:#132033; --line:#213856;
      --fg:#EAF3FC; --text2:#9DB4CD; --blue:#38B6FF; --cyan:#6FD0FF; --pink:#FB7299;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem;
    color:var(--fg); text-align:center;
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
  }
  .card {
    position:relative; display:inline-block; max-width:26rem; padding:2.6rem 2.2rem 2.2rem;
    border-radius:18px; border:1px solid var(--line); background:var(--panel);
    box-shadow:0 18px 50px rgba(16,60,110,.14);
  }
  .card::before {
    content:""; position:absolute; inset:0 0 auto 0; height:4px; border-radius:18px 18px 0 0;
    background:linear-gradient(90deg, var(--blue), var(--cyan));
  }
  .mark { display:grid; place-items:center; width:3.2rem; height:3.2rem; margin:0 auto 1rem;
    border-radius:11px; background:linear-gradient(160deg,#1C1E22 0%,#131416 62%,#0F1113 100%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), 0 10px 22px -14px rgba(10,16,24,.65); }
  .mark svg { display:block; width:2.62rem; height:2.62rem; }
  .badge {
    display:inline-block; padding:.24rem .85rem; border-radius:999px;
    border:1px solid rgba(18,138,250,.35); background:rgba(18,138,250,.08);
    color:var(--blue); font-size:.72rem; font-weight:800; letter-spacing:.12em;
  }
  h1 { font-size:clamp(1.45rem,5vw,1.9rem); letter-spacing:-.03em; margin:1.1rem 0 .7rem; }
  p { color:var(--text2); margin:0 0 1.8rem; line-height:1.8; font-size:.94rem; }
  a {
    display:inline-block; padding:.78rem 1.5rem; border-radius:12px;
    background:linear-gradient(135deg, var(--blue), #0E7BE0); color:#fff; text-decoration:none;
    font-size:.94rem; font-weight:800; letter-spacing:.02em;
    box-shadow:0 8px 20px rgba(18,138,250,.32);
  }
  .code { margin-top:1.3rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.72rem;
    letter-spacing:.12em; color:var(--text2); opacity:.7; }
</style>
</head>
<body>
  <div class="card">
    <span class="mark" aria-hidden="true">
      <svg viewBox="7.1 12.1 49.7 36.3" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="m-sp" x1="0.1" y1="0.15" x2="0.9" y2="0.9">
            <stop offset="0" stop-color="#22A6FF"></stop>
            <stop offset="0.5" stop-color="#0B84FF"></stop>
            <stop offset="1" stop-color="#0A6FE0"></stop>
          </linearGradient>
        </defs>
        <path d="M23.59 18.88H28.45L24.72 38.28Q23.29 45.95 15.68 45.95Q12.83 45.95 11.21 44.45Q9.59 42.96 9.59 40.33Q9.59 39.11 9.82 37.99L10.30 35.40H15.16L14.64 38.17Q14.52 38.78 14.52 39.40Q14.52 40.26 15.11 40.80Q15.71 41.34 16.65 41.34Q19.25 41.34 19.86 38.28Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.90" stroke-linejoin="round"></path>
        <path d="M35.85 36.70 34.23 45.12H29.37L34.39 18.88H39.25L37.05 30.40L48.51 18.88H54.28L42.59 30.36L50.20 45.12H44.40L38.80 33.82Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2.90" stroke-linejoin="round"></path>
        <path d="M 11.07 33.30 L 27.85 27.82 L 32.75 13.53 L 30.45 27.82 L 45.05 25.45 L 30.01 29.98 L 26.78 39.41 L 28.29 29.98 L 11.07 33.30 Z" fill="none" stroke="#131416" stroke-width="0.80" stroke-linejoin="round"></path>
        <path d="M 11.07 33.30 L 27.85 27.82 L 32.75 13.53 L 30.45 27.82 L 45.05 25.45 L 30.01 29.98 L 26.78 39.41 L 28.29 29.98 L 11.07 33.30 Z" fill="url(#m-sp)"></path>
      </svg>
    </span>
    <span class="badge">NOT FOUND</span>
    <h1>여기에는 기록이 없습니다</h1>
    <p>주소가 바뀌었거나, 오타일 수 있습니다.</p>
    <a id="home" href="/">첫 화면으로 돌아가기</a>
    <p class="code">ERROR 404 · 전설 아카이브</p>
  </div>
  <script>
    // jeonsul.github.io 는 사용자 사이트라 첫 화면이 도메인 루트(/)에 있습니다.
    (function () {
      var home = location.pathname.indexOf('/Jeonsul.github.io') === 0 ? '/Jeonsul.github.io/' : '/';
      document.getElementById('home').setAttribute('href', home);
      setTimeout(function () { location.replace(home); }, 2400);
    })();
  </script>
</body>
</html>
